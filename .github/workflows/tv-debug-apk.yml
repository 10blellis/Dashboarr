name: Build Dashboarr TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - dashboarr-tv

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_TV: "1"
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android TV project
        run: pnpm tv:prebuild

      - name: Build standalone TV APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Dashboarr TV APK
        uses: actions/upload-artifact@v4
        with:
          name: dashboarr-tv-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
